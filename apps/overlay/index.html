<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>twitch-village</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: transparent;
				overflow: hidden;
			}
			#app {
				position: absolute;
				inset: 0;
				background: transparent;
			}
			#app canvas {
				display: block;
				background: transparent;
			}
			html.tv-preview body {
				background: #e5e7eb;
			}
			@media (prefers-color-scheme: dark) {
				html.tv-preview body {
					background: #0b0d12;
				}
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
